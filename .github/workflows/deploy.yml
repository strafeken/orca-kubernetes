name: Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: strafeken/orca-backend:${{ steps.vars.outputs.sha_short }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: strafeken/orca-frontend:${{ steps.vars.outputs.sha_short }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=$PATH:/var/lib/rancher/rke2/bin
            cd ~/orca-kubernetes
            git pull
            cd k8s
            ./deploy.sh orca-staging.xubi.org ${{ needs.build.outputs.image_tag }}
            sleep 15
            kubectl get pods -n orca

  zap-baseline:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://orca-staging.xubi.org'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-z "-config network.connection.sslErrorTolerant=true"'
          allow_issue_writing: false
          fail_action: true
      - name: Upload ZAP baseline report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html

  nuclei-scan:
    needs: zap-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Run Nuclei Scan
        uses: projectdiscovery/nuclei-action@v3.1.1
        with:
          args: '-u https://orca-staging.xubi.org -severity critical,high -stats -o nuclei-output.txt'
      - name: Upload Nuclei report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nuclei-report
          path: nuclei-output.txt

  deploy-production:
    needs: [build, deploy-staging, zap-baseline, nuclei-scan]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=$PATH:/var/lib/rancher/rke2/bin
            cd ~/orca-kubernetes
            git pull
            cd k8s
            ./deploy.sh orca.freeddns.org ${{ needs.build.outputs.image_tag }}
            sleep 15
            kubectl get pods -n orca